plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.9.0'
	id 'com.github.spotbugs' version '6.5.10'
}

group = 'com.feple'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}


repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux' // 카카오 로그
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	// Spring Boot 3.4.4 BOM이 관리하는 기본 버전(9.1.0)은 CVE-2025-30706(높음, 원격 취약점)에
	// 취약해 명시적으로 고정 오버라이드한다.
	runtimeOnly 'com.mysql:mysql-connector-j:26.7.0'
	implementation 'org.flywaydb:flyway-mysql'
	testRuntimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.4.2")
	implementation "io.awspring.cloud:spring-cloud-aws-starter-s3"

	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	implementation 'com.bucket4j:bucket4j-core:8.10.1'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	implementation platform("software.amazon.awssdk:bom:2.54.2")
	// google-cloud-storage(firebase-admin의 전이 의존성)가 jackson-dataformat-xml을 끌어와
	// Spring이 MappingJackson2XmlHttpMessageConverter를 자동 등록 → Accept 헤더 없는 요청의
	// 기본 응답이 JSON 대신 XML로 바뀌는 회귀가 발생해 명시적으로 제외한다
	implementation('com.google.firebase:firebase-admin:9.10.0') {
		exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
	}

	implementation 'net.javacrumbs.shedlock:shedlock-spring:7.9.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.9.0'

	implementation 'org.jsoup:jsoup:1.23.2'
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	implementation 'com.drewnoakes:metadata-extractor:2.21.0' // 이미지 리사이즈 시 EXIF Orientation 태그 반영용
	// javax.imageio는 webp를 기본 지원하지 않아 프로필 이미지 업로드에서 webp가 거부되던 문제 해결용.
	// sejda 포크(0.1.6, 2015)는 x86_64 네이티브만 번들해 Apple Silicon 로컬에서 UnsatisfiedLinkError가
	// 났다 — usefulness 포크는 패키지·SPI가 동일하면서 mac-aarch64/linux-aarch64 네이티브까지 포함한다.
	implementation 'com.github.usefulness:webp-imageio:0.11.0'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.9.0'

	// sentry.dsn 미설정 시 경고만 남기고 비활성 상태로 정상 기동 — SENTRY_DSN 없어도 안전
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.53.0'
	// sentry-spring-boot-starter-jakarta는 이 모듈을 자동으로 끌어오지 않음 — 클래스패스에
	// 함께 있어야 기존 log.error(..., exception) 호출들이 별도 코드 수정 없이 Sentry로 전송됨
	implementation 'io.sentry:sentry-logback:8.53.0'

}

jacoco {
	toolVersion = "0.8.12"
}

// import 정렬/미사용 import 제거만 자동화한다 — google-java-format 등 전체 리포맷터는
// 기존 497개 파일의 들여쓰기·줄바꿈까지 전부 건드려 리뷰 불가능한 diff를 만들기 때문에 도입하지 않음
spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		importOrder()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 트리아지 완료 — spotbugsMain은 현재 0건, spotbugsTest의 오탐(Mockito @Mock 미read,
// 의도적 null 전달)은 config/spotbugs/exclude.xml에서 테스트 소스 한정으로 제외했다.
// 이제 새 findings가 생기면 CI가 실패하도록 강제한다. 노이즈 규칙 제외는 exclude.xml에서 관리.
spotbugs {
	ignoreFailures = false
	showStackTraces = false
	excludeFilter = file('config/spotbugs/exclude.xml')
}

// spring-boot의 dependency-management BOM이 모든 configuration(spotbugs 툴체인 포함)에
// commons-lang3 버전을 강제로 낮춰버려(3.20.0 -> 3.17.0) NoClassDefFoundError로 분석 자체가
// 실패한다. resolutionStrategy.force/constraints 둘 다 BOM을 못 이겨서 dependencies에
// strictly로 직접 선언해야 한다 — 단, 그러면 플러그인이 자동 주입하던 spotbugs 엔진 자체
// (defaultDependencies)가 빠지므로 엔진 좌표도 같이 명시해야 함
dependencies {
	spotbugs "com.github.spotbugs:spotbugs:4.10.4"
	spotbugs('org.apache.commons:commons-lang3') {
		version { strictly '3.20.0' }
	}
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html {
			required = true
			outputLocation = file("$buildDir/reports/spotbugs/${name}.html")
		}
	}
}

// 리포트·검증에서 공통으로 제외하는 클래스 — 로직이 거의 없는 계층(dto/entity/config/event)과
// 프레임워크 부트스트랩/예외 클래스는 커버리지 측정 대상에서 뺀다.
def coverageExclusions = [
	'**/dto/**',
	'**/entity/**',
	'**/config/**',
	'**/event/**',
	'**/*Application*',
	'**/*Exception*',
]

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true   // CI 도구 연동용
		html.required = true  // 브라우저 열람용
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: coverageExclusions)
		}))
	}
}

// 커버리지 회귀 방지 게이트 — 현재 instruction 94% / branch 81% 수준이며, 일시적 변동을
// 감안해 그보다 낮은 하한선만 강제한다. 여유가 줄면 minimum 값을 올려 조인다.
jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: coverageExclusions)
		}))
	}
	violationRules {
		rule {
			limit {
				counter = 'INSTRUCTION'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.75
			}
		}
	}
}

tasks.named('check') {
	dependsOn jacocoTestCoverageVerification
}

tasks.named('test') {
	useJUnitPlatform()
	// 운영 JVM은 Asia/Seoul로 고정돼 있으나(FepleBackendApplication static 블록), main()을 타지 않는
	// 순수 단위 테스트 JVM은 CI 러너 기본 타임존(UTC)을 쓴다 — 운영과 동일하게 맞춰 기본 존 의존 버그를 잡는다.
	systemProperty 'user.timezone', 'Asia/Seoul'
	finalizedBy jacocoTestReport
	testLogging {
		exceptionFormat = "full"
		showCauses = true
		showStackTraces = true
	}
}
