plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.8.0'
	id 'com.github.spotbugs' version '6.5.9'
}

group = 'com.feple'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}


repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux' // 카카오 로그
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	implementation 'org.flywaydb:flyway-mysql'
	testRuntimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'

	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	implementation platform("io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1")
	implementation "io.awspring.cloud:spring-cloud-aws-starter-s3"

	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	implementation 'com.bucket4j:bucket4j-core:8.10.1'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-cache'

	implementation platform("software.amazon.awssdk:bom:2.25.1")
	implementation 'com.google.firebase:firebase-admin:9.3.0'

	implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
	implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

	implementation 'org.jsoup:jsoup:1.18.3'
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	implementation 'com.drewnoakes:metadata-extractor:2.19.0' // 이미지 리사이즈 시 EXIF Orientation 태그 반영용

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

}

jacoco {
	toolVersion = "0.8.12"
}

// import 정렬/미사용 import 제거만 자동화한다 — google-java-format 등 전체 리포맷터는
// 기존 497개 파일의 들여쓰기·줄바꿈까지 전부 건드려 리뷰 불가능한 diff를 만들기 때문에 도입하지 않음
spotless {
	java {
		target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
		importOrder()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

// 기존 코드베이스를 아직 트리아지하지 않아서 ignoreFailures로 시작한다 — 리포트만 쌓고,
// 발견된 항목들을 검토해 정리한 뒤 점진적으로 강제(false)로 전환할 예정
spotbugs {
	ignoreFailures = true
	showStackTraces = false
	excludeFilter = file('config/spotbugs/exclude.xml')
}

// spring-boot의 dependency-management BOM이 모든 configuration(spotbugs 툴체인 포함)에
// commons-lang3 버전을 강제로 낮춰버려(3.20.0 -> 3.17.0) NoClassDefFoundError로 분석 자체가
// 실패한다. resolutionStrategy.force/constraints 둘 다 BOM을 못 이겨서 dependencies에
// strictly로 직접 선언해야 한다 — 단, 그러면 플러그인이 자동 주입하던 spotbugs 엔진 자체
// (defaultDependencies)가 빠지므로 엔진 좌표도 같이 명시해야 함
dependencies {
	spotbugs "com.github.spotbugs:spotbugs:4.10.3"
	spotbugs('org.apache.commons:commons-lang3') {
		version { strictly '3.20.0' }
	}
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html {
			required = true
			outputLocation = file("$buildDir/reports/spotbugs/${name}.html")
		}
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true   // CI 도구 연동용
		html.required = true  // 브라우저 열람용
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
				'**/dto/**',
				'**/entity/**',
				'**/config/**',
				'**/event/**',
				'**/*Application*',
				'**/*Exception*',
			])
		}))
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	testLogging {
		exceptionFormat = "full"
		showCauses = true
		showStackTraces = true
	}
}
