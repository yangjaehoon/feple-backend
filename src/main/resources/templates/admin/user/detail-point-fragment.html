<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ── 최근 포인트 내역 ── -->
<th:block th:fragment="pointCard">

    <div class="card">
        <div class="card-header">
            <div class="card-title">
                🪙 최근 포인트 내역
                <span class="card-count" th:text="${#lists.size(recentPointLogs)}"></span>
            </div>
            <a th:href="@{/admin/points(keyword=${user.nickname})}" class="btn btn-secondary btn-sm">전체 내역 보기</a>
        </div>

        <!-- 포인트 직접 지급/차감 폼 -->
        <div class="card-body">
            <form th:action="@{/admin/users/{id}/points/grant(id=${user.id})}" method="post">
                <div class="ban-form-row">
                    <div>
                        <div class="ban-label">지급 포인트 (차감은 음수)</div>
                        <input type="number" name="amount" class="select-auto" placeholder="예: 100 / -50" required/>
                    </div>
                    <div class="ban-form-reason">
                        <div class="ban-label">지급 사유</div>
                        <input type="text" name="reason" placeholder="지급 사유를 입력하세요" maxlength="100" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm"
                        data-confirm="이 회원에게 포인트를 지급/차감하시겠습니까?">포인트 지급</button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th class="col-w80">변동</th>
                    <th>사유</th>
                    <th class="col-w120">참조</th>
                    <th class="col-w120">일시</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="log : ${recentPointLogs}">
                    <td>
                        <span class="badge"
                              th:classappend="${log.delta >= 0} ? 'badge-success' : 'badge-danger'"
                              th:text="${(log.delta >= 0 ? '+' : '') + log.delta}"></span>
                    </td>
                    <td>
                        <span th:text="${log.reason.displayName}"></span>
                        <div th:if="${log.note != null}" class="cell-secondary" th:text="${log.note}"></div>
                    </td>
                    <td>
                        <a th:if="${log.linksToPost}"
                           th:href="@{/admin/posts/{id}(id=${log.refId})}"
                           class="btn btn-secondary btn-sm">게시글 보기</a>
                        <a th:if="${log.linksToCertification}"
                           th:href="@{/admin/certifications/{id}(id=${log.refId})}"
                           class="btn btn-secondary btn-sm">인증 보기</a>
                        <span th:if="${!log.linksToPost and !log.linksToCertification}">-</span>
                    </td>
                    <td class="td-date" th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(recentPointLogs)}" th:replace="~{admin/fragments :: emptyRow(4, '포인트 내역이 없습니다.')}"></tr>
                </tbody>
            </table>
        </div>
    </div>

</th:block>

</body>
</html>
