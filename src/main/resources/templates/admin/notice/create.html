<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: head('공지사항 작성')}"></head>
<body>
<div th:insert="~{admin/fragments :: navbar('notices')}"></div>
<div class="main-content">
    <div th:replace="~{admin/fragments :: pageHeader2('공지사항 작성', '공지사항', @{/admin/notices}, '작성')}"></div>
    <div class="content-area">

        <div th:replace="~{admin/fragments :: formErrors}"></div>

        <div class="card card-form">
            <div class="card-header">
                <div class="card-title">새 공지사항</div>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/notices/new}"
                      th:object="${notice}"
                      method="post">

                    <div class="form-grid">
                        <div class="form-group">
                            <label>제목 <span class="required-star">*</span></label>
                            <input type="text" th:field="*{title}" placeholder="공지사항 제목" maxlength="200" required/>
                            <span class="field-error">제목을 입력해주세요.</span>
                        </div>

                        <div class="form-group">
                            <label>내용 <span class="required-star">*</span></label>
                            <textarea th:field="*{content}" placeholder="공지사항 내용을 입력하세요" rows="10" required></textarea>
                            <span class="field-error">내용을 입력해주세요.</span>
                        </div>

                        <div class="form-group">
                            <label class="form-check-label">
                                <input type="checkbox" th:field="*{pinned}" class="cb-input"/>
                                상단에 고정 노출
                            </label>
                            <span class="field-hint">체크하면 목록 최상단에 항상 노출됩니다.</span>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">등록하기</button>
                        <a th:href="@{/admin/notices}" class="btn btn-secondary">취소</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>AdminUtils.initDirtyGuard();</script>
</body>
</html>
