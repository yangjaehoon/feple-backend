spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - io.awspring.cloud.autoconfigure.s3.S3TransferManagerAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.AwsAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.CredentialsProviderAutoConfiguration
      - io.awspring.cloud.autoconfigure.core.RegionProviderAutoConfiguration
  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket: test-bucket

jwt:
  secret: "test-secret-key-must-be-at-least-32-characters-long-for-hs256"
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 604800000

app:
  # 문서 공개는 로컬 전용이므로 테스트에서도 명시적으로 닫아 둔다.
  # (application-local.yaml은 application.yml의 on-profile: "!test" 문서로 분리돼 있어
  #  테스트에 로드되지 않는다 — LocalConfigIsolationTest가 이를 고정한다)
  swagger:
    public-access: false
  s3:
    bucket: test-bucket
    presign-minutes: 10
  admin:
    username: test-admin
    password: test-admin-password
