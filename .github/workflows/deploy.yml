name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 실제로 배포에 영향 없는 커밋(문서, 테스트 전용 변경 등)까지 매번 운영 서버를 재시작시키는
  # 문제를 막기 위해, 배포에 영향 주는 경로가 바뀌었는지 먼저 판별한다.
  # 수동 실행(workflow_dispatch)은 경로와 무관하게 항상 배포하도록 예외 처리.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'src/main/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/wrapper/**'
              - 'gradlew'

  deploy:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Create application-local.yaml
        env:
          APPLICATION_LOCAL_YAML: ${{ secrets.APPLICATION_LOCAL_YAML }}
        run: |
          mkdir -p src/main/resources
          printf '%s' "$APPLICATION_LOCAL_YAML" > src/main/resources/application-local.yaml
          # Strip spring.flyway.enabled=false so Flyway runs migrations on production startup
          sed -i '/^  flyway:$/{N; /\n    enabled: false/d}' src/main/resources/application-local.yaml

      - name: Test with Gradle
        run: ./gradlew cleanTest test

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Build with Gradle
        if: needs.changes.outputs.backend == 'true'
        run: ./gradlew bootJar -x test

      - name: Stop service before deploy
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop feple.service || true

      - name: Deploy to EC2
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/tmp/"
          strip_components: 2
          timeout: 120s
          command_timeout: 30m

      - name: Start Spring Boot service
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 롤백 대비 — 지금 배포돼 있는 jar를 백업해둔다 (최초 배포라면 없음)
            if [ -f /opt/feple/feple.jar ]; then
              sudo cp /opt/feple/feple.jar /opt/feple/feple.jar.bak
            fi
            sudo mv /tmp/*.jar /opt/feple/feple.jar
            sudo mkdir -p /etc/systemd/system/feple.service.d
            sudo tee /etc/systemd/system/feple.service.d/jvm.conf > /dev/null << 'EOF'
            [Service]
            Environment="JAVA_TOOL_OPTIONS=-Xms128m -Xmx300m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -Xss256k -XX:MaxGCPauseMillis=200 -XX:+UseG1GC"
            EOF
            sudo systemctl daemon-reload
            sudo systemctl start feple.service

            rollback() {
              echo "=== 배포 실패 — 최근 로그 ==="
              sudo journalctl -u feple.service --no-pager -n 50
              if [ -f /opt/feple/feple.jar.bak ]; then
                echo "=== 이전 jar로 롤백 ==="
                sudo systemctl stop feple.service || true
                sudo mv /opt/feple/feple.jar.bak /opt/feple/feple.jar
                sudo systemctl start feple.service
                echo "롤백 완료 — 배포 자체는 실패로 표시됨"
              else
                echo "백업된 이전 jar가 없어 롤백하지 않음 (최초 배포로 추정)"
              fi
              exit 1
            }

            # 1) systemd 프로세스가 뜨는지 확인 (Type=simple은 실제 부팅 완료 전에도 active가 됨)
            PROCESS_UP=false
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(systemctl is-active feple.service)
              echo "[$i/12] feple.service: $STATUS"
              if [ "$STATUS" = "active" ]; then PROCESS_UP=true; break; fi
              if [ "$STATUS" = "failed" ]; then rollback; fi
            done
            if [ "$PROCESS_UP" != "true" ]; then
              echo "60초 내에 프로세스가 active 상태가 되지 않음"
              rollback
            fi

            # 2) 프로세스 기동과 별개로, Spring Boot가 실제 요청을 받을 수 있는지 헬스체크로 확인
            #    (기동 시간이 원래 45~48초였다가 최근 박스 부하로 95~100초대까지 늘어난 것을
            #    실측함 — 90초 예산으로 4연속 배포가 타임아웃돼 롤백됐음. 여유를 두고 최대 180초 대기)
            for i in $(seq 1 36); do
              if curl -sf --max-time 3 http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "헬스체크 통과 — 배포 완료"
                sudo rm -f /opt/feple/feple.jar.bak
                exit 0
              fi
              echo "[$i/36] 헬스체크 대기 중..."
              sleep 5
            done
            echo "180초 내에 헬스체크를 통과하지 못함"
            rollback
