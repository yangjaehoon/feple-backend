name: Deploy to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 실제로 배포에 영향 없는 커밋(문서, 테스트 전용 변경 등)까지 매번 운영 서버를 재시작시키는
  # 문제를 막기 위해, 배포에 영향 주는 경로가 바뀌었는지 먼저 판별한다.
  # 수동 실행(workflow_dispatch)은 경로와 무관하게 항상 배포하도록 예외 처리.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/main/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/wrapper/**'
              - 'gradlew'

  deploy:
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Create application-local.yaml
        env:
          APPLICATION_LOCAL_YAML: ${{ secrets.APPLICATION_LOCAL_YAML }}
        run: |
          mkdir -p src/main/resources
          printf '%s' "$APPLICATION_LOCAL_YAML" > src/main/resources/application-local.yaml
          # Strip spring.flyway.enabled=false so Flyway runs migrations on production startup
          sed -i '/^  flyway:$/{N; /\n    enabled: false/d}' src/main/resources/application-local.yaml

      - name: Test with Gradle
        run: ./gradlew cleanTest test

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          retention-days: 14

      - name: Build with Gradle
        if: needs.changes.outputs.backend == 'true'
        run: ./gradlew bootJar -x test

      - name: Stop service before deploy
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop feple.service || true

      - name: Deploy to EC2
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/tmp/"
          strip_components: 2
          timeout: 120s
          command_timeout: 30m

      - name: Start Spring Boot service
        if: needs.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mv /tmp/*.jar /opt/feple/feple.jar
            sudo mkdir -p /etc/systemd/system/feple.service.d
            sudo tee /etc/systemd/system/feple.service.d/jvm.conf > /dev/null << 'EOF'
            [Service]
            Environment="JAVA_TOOL_OPTIONS=-Xms128m -Xmx300m -XX:MaxMetaspaceSize=192m -XX:ReservedCodeCacheSize=48m -Xss256k -XX:MaxGCPauseMillis=200 -XX:+UseG1GC"
            EOF
            sudo systemctl daemon-reload
            sudo systemctl start feple.service
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(systemctl is-active feple.service)
              echo "[$i/12] feple.service: $STATUS"
              if [ "$STATUS" = "active" ]; then exit 0; fi
              if [ "$STATUS" = "failed" ]; then
                journalctl -u feple.service --no-pager -n 30
                exit 1
              fi
            done
            echo "Service did not become active within 60s"
            journalctl -u feple.service --no-pager -n 30
            exit 1
