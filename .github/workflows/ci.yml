name: Backend CI

on:
  pull_request:
    branches: [ main ]

# 같은 PR에 커밋이 연달아 push되면 이전 실행은 취소하고 최신 커밋만 검증한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 병렬 PR이 같은 버전 번호를 잡거나(V10 중복 사고 2회), main 최신보다 낮은 번호를 추가하면
      # out-of-order=false 설정상 prod에서 영구 스킵된다 — 머지 전에 잡는다.
      - name: Check Flyway migration versioning
        run: |
          set -euo pipefail
          SQL='src/main/resources/db/migration/V*.sql'
          JAVA='src/main/java/db/migration/V*.java'
          git fetch --quiet --depth=1 origin main
          ver() { sed -nE 's#.*/V([0-9]+)__[^/]+\.(sql|java)$#\1#p'; }

          # 1) 이미 적용된(main에 있는) 마이그레이션의 수정·삭제 금지 — Flyway 체크섬이 깨져 다음 배포가 실패한다
          touched=$(git diff --no-renames --diff-filter=MD --name-only origin/main HEAD -- \
            'src/main/resources/db/migration/' 'src/main/java/db/migration/')
          if [ -n "$touched" ]; then
            echo "::error::기존 Flyway 마이그레이션을 수정/삭제함 (체크섬 불일치로 배포 실패):"
            echo "$touched"
            exit 1
          fi

          added=$(git diff --diff-filter=A --name-only origin/main HEAD -- \
            'src/main/resources/db/migration/' 'src/main/java/db/migration/' | ver | sort -n)
          if [ -z "$added" ]; then echo "새 마이그레이션 없음 — 스킵"; exit 0; fi

          # 2) 버전 번호 중복 금지 (병렬 PR이 같은 번호 사용)
          dup=$(git ls-files $SQL $JAVA | ver | sort -n | uniq -d || true)
          if [ -n "$dup" ]; then
            echo "::error::중복된 Flyway 버전 번호: V$(echo "$dup" | paste -sd' V' -)"
            exit 1
          fi

          main_max=$(git ls-tree -r --name-only origin/main -- \
            'src/main/resources/db/migration/' 'src/main/java/db/migration/' | ver | sort -n | tail -1)
          echo "main 최신 V$main_max / 이 PR 추가 V$(echo "$added" | paste -sd' V' -)"

          # 3) 새 버전은 V(main_max+1)부터 빈틈 없이 연속이어야 한다
          expected=$((main_max + 1))
          for v in $added; do
            if [ "$v" -ne "$expected" ]; then
              echo "::error::Flyway 버전이 연속적이지 않음: 기대 V$expected, 실제 V$v (main 최신 V$main_max)"
              echo "  최신 확인: ls src/main/resources/db/migration | sort -V | tail -1  →  그 +1 사용"
              exit 1
            fi
            expected=$((expected + 1))
          done
          echo "Flyway 마이그레이션 버전 검증 통과"

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Compile
        run: ./gradlew compileJava compileTestJava

      # test 프로파일은 H2 인메모리 DB + 더미 시크릿을 사용해 application-local.yaml
      # (GitHub Secret) 없이도 동작한다 — Dependabot PR은 저장소 시크릿에 접근할 수 없어
      # 이 부분이 깨지면 dependabot PR의 CI가 전부 실패한다.
      - name: Test with Gradle
        run: ./gradlew cleanTest test

      - name: Run SpotBugs
        run: ./gradlew spotbugsMain spotbugsTest

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html/
          retention-days: 14
